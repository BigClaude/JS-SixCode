<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <h1> Simple Calculator</h1>
      <div>
        Result :<input type="number"  id="result"><br><br>
       Number1<input type="number" placeholder="number 1" id="n1" required><br><br>
       number2 <input type="number" placeholder="number 2" id="n2" required><br><br>
       <button>+</button>  <button>-</button>  <button>X</button>  <button>/</button>
         <button>=</button>   <button>.</button>

      </div>
      
<script>

    let num1 = Number(document.getElementById("n1"));
    let num2 = Number(document.getElementById("n2"));

    let res = document.getElementById("result");

    let choice = prompt("Enter operator (+, -, X, /)");

    if (choice == "+") {
        res.innerHTML = num1 + num2;
    }

    else if (choice == "-") {
        res.innerHTML = num1 - num2;
    }

    else if (choice == "X") {
        res.innerHTML = num1 * num2;
    }

    else if (choice == "/") {
        if (num2 != 0) {
            res.innerHTML = num1 / num2;
        }
        else {
            res.innerHTML = "Cannot divide by zero";
        }
    }

    else {
        res.innerHTML = "Invalid operator";
    }

</script>

      
</body>
</html>
